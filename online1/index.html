<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="styles.css"> <!-- Подключение CSS -->
</head>
<body>
    <div class="store-container">
        <h1>Store Products</h1>
        <div class="products">
            <div class="product" id="product1">
                <h2>Chanel Bag</h2>
                <img src="imagess/chanel-bag.JPG" alt="Chanel Bag">
                <p>Price: $5000</p>
                <button onclick="makePurchase('Chanel Bag', 5000)">Buy</button>
            </div>
            <div class="product" id="product2">
                <h2>Dior Lipstick</h2>
                <img src="imagess/dior-lipstick.JPG" alt="Dior Lipstick">
                <p>Price: $40</p>
                <button onclick="makePurchase('Dior Lipstick', 40)">Buy</button>
            </div>
            <div class="product" id="product3">
                <h2>YSL Shoes</h2>
                <img src="imagess/ysl-shoes.JPG" alt="YSL Shoes">
                <p>Price: $1200</p>
                <button onclick="makePurchase('YSL Shoes', 1200)">Buy</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script> 
</body>
</html>
